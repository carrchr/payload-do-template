name: payload-do-template
region: nyc
envs:
  - key: PAYLOAD_SECRET
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: REPLACE_ME
  - key: NEXT_PUBLIC_SERVER_URL
    scope: RUN_AND_BUILD_TIME
    value: ${APP_URL}
  - key: CRON_SECRET
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: REPLACE_ME
  - key: PREVIEW_SECRET
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: REPLACE_ME

databases:
  - name: payload-do-template-db
    engine: PG
    production: false

services:
  - name: web
    github: &repo
      repo: carrchr/payload-do-template
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    # Split across build vs. run because App Platform's build step has no
    # database access but the run step does (see shared_envs comment below
    # and README's "A platform limitation worth knowing"): compile now,
    # then generate the static pages once the container starts and can
    # reach Postgres, before next start begins serving traffic.
    build_command: pnpm build:compile
    run_command: pnpm build:generate && pnpm start
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /
    envs: &shared_envs
      # App Platform builds (buildpack or Dockerfile) never have database
      # access — DO's own guidance is not to rely on DB connectivity during
      # build. The web service's run_command does the DB-dependent static
      # generation pass instead (see build_command/run_command above), so
      # RUN_TIME is all this needs.
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${payload-do-template-db.DATABASE_URL}
      # DO's managed/dev Postgres uses a cert signed by DO's own CA, which
      # node-postgres won't trust by default (SELF_SIGNED_CERT_IN_CHAIN).
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${payload-do-template-db.CA_CERT}
      - key: SPACES_KEY_ID
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: SPACES_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: SPACES_BUCKET_NAME
        scope: RUN_TIME
        value: REPLACE_ME
      - key: SPACES_REGION
        scope: RUN_TIME
        value: REPLACE_ME

jobs:
  - name: migrate
    github: *repo
    kind: PRE_DEPLOY
    environment_slug: node-js
    # Skip the `build` script (a full `next build`) — this job only needs
    # dependencies installed to run the migrate CLI.
    build_command: pnpm install --frozen-lockfile
    run_command: pnpm payload migrate
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs: *shared_envs
