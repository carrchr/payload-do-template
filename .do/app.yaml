name: payload-do-template
region: nyc
envs:
  - key: PAYLOAD_SECRET
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: EV[1:A5lg9VH5NW9Zsr/9dlH5DNTfwciO2nAQ:p8pVg8lvi1vz8MoDM4cuUhBWepWR4i9Gpf6LWaWtbd0gJ159nslEAM2WcC64QpaXVije7V/50uTojaUY]
  - key: NEXT_PUBLIC_SERVER_URL
    scope: RUN_AND_BUILD_TIME
    value: ${APP_URL}
  - key: CRON_SECRET
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: EV[1:hOz68Jnsi65ts3tHw+csh5gcHanrfAu6:xqMk87ELOthpHCpyldxUPY3Ao5dNNo3ZUHbF77yHBpSHt/j+4YpL5QY5thvE++moK10DEGbRzi4bW0VI]
  - key: PREVIEW_SECRET
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: EV[1:IlNMrGSeS5tizmynZpDEqYM3w7oZA/Y2:7zkOy7hlxah5ADmQIXCex8E6hsPz5DGO7ZL++nTGbj0ebddZdau3MItt2ma2Cf/RtWk/w9CrmrU6mYO9]

databases:
  - name: payload-do-template-db
    engine: PG
    production: false

services:
  - name: web
    github: &repo
      repo: carrchr/payload-do-template
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    build_command: pnpm build
    run_command: pnpm start
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /
    envs: &shared_envs
      # App Platform builds (buildpack or Dockerfile) never have database
      # access — DO's own guidance is not to rely on DB connectivity during
      # build. generateStaticParams in the frontend routes was changed to
      # skip its DB query for this reason, so RUN_TIME is all this needs.
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${payload-do-template-db.DATABASE_URL}
      # DO's managed/dev Postgres uses a cert signed by DO's own CA, which
      # node-postgres won't trust by default (SELF_SIGNED_CERT_IN_CHAIN).
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${payload-do-template-db.CA_CERT}
      - key: SPACES_KEY_ID
        scope: RUN_TIME
        type: SECRET
        value: EV[1:42hygxVwoNRVZOed0FN841Msr4IblQyZ:lh9RuqKp0kkAN6v1GN/5Gtc1wHqxy/HR/U9Y4CYdbv1Kcnqj]
      - key: SPACES_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
        value: EV[1:tjrOHo4nuK+SLKFMqvxgMXe5O4attxye:KP8+LunuJbLlWjSN3Vwp1goz0wPNQC9/DYrtLOo18yKU/13z8GhVrBEdBXZ9be0NE4ouLzBOs/evwGw=]
      - key: SPACES_BUCKET_NAME
        scope: RUN_TIME
        value: payload-do-template
      - key: SPACES_REGION
        scope: RUN_TIME
        value: nyc3

jobs:
  - name: migrate
    github: *repo
    kind: PRE_DEPLOY
    environment_slug: node-js
    # Skip the `build` script (a full `next build`) — this job only needs
    # dependencies installed to run the migrate CLI.
    build_command: pnpm install --frozen-lockfile
    run_command: pnpm payload migrate
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs: *shared_envs
